  <div class="screen dark" id="jets">${status()}${hdr("Flight Plan")}<div class="body">
     <div class="flight-section">Upcoming Flights</div>
     ${DATA.jets.upcoming.map(j=>`<div class="jet-card">

        <div class="jet-details" style="font-size:11px;color:#71767b">${esc(j[3])}</div>

     ${DATA.jets.past.map(j=>`<div class="jet-card" style="opacity:0.6">

  <div id="passcode"><div class="cancel" onclick="closePasscode()">Cancel</div><div class="dots" id="dots"></div><div class="msg" id="pmsg"></div><div class="pad" id="pad"></div></div>`;

function switchStockTab(tab) {
  currentStockTab = tab;
  document.querySelectorAll('.stock-seg span').forEach((el, i) => {
    el.classList.toggle('active', (tab === 'markets' && i===0) || (tab === 'holdings' && i===1) || (tab === 'news' && i===2));
  });
  renderStocks();
}

function renderStocks() {
  const container = $("#stock-content");
  if(currentStockTab === 'holdings') {
    container.innerHTML = `
      <div class="stock-summary"><div class="eyebrow">PORTFOLIO WATCHLIST</div><div class="headline">6 Companies</div></div>
      ${DATA.stocks.map(s=>`<div class="stock-row"><div class="stock-mark">${STOCK_MARKS[s[3]]||""}</div><div class="stock-l"><div class="sym">${esc(s[0])}</div><div class="nm">${esc(s[1])}</div></div><div class="stock-r"><div class="pct ${s[4][0]==="-"?"red":"grn"}">${esc(s[4])}</div><div class="price">${esc(s[5])}</div></div></div>`).join("")}
    `;
  } else if(currentStockTab === 'news') {
    container.innerHTML = `
      <div class="stock-news-list">
        ${DATA.stockNews.map(n=>`<div class="news-item">${esc(n[0])}<div class="src">${esc(n[1])}</div></div>`).join("")}
      </div>
    `;
  } else {
    container.innerHTML = `<div style="padding:20px;color:#8e8e93;text-align:center;">Market data unavailable.</div>`;
  }
}

function wxIcon(type){
  if(type=="sun") return `<svg viewBox="0 0 64 64"><circle cx="32" cy="29" r="14" fill="#ffd45a"/><g stroke="#ffd45a" stroke-width="3.5" stroke-linecap="round"><path d="M32 5v7M32 46v7M8 29h7M49 29h7M15 12l5 5M44 41l5 5M15 46l5-5M44 17l5-5"/></g><path d="M48 55H20a13 13 0 0 1 0-26c2 0 4 .5 5.8 1.4A15 15 0 0 1 54 42a10 10 0 0 1-6 13z" fill="#fff" stroke="#e8f3ff" stroke-width="1.5"/></svg>`;
  if(type=="rain") return `<svg viewBox="0 0 64 64"><path d="M48 42H18a13 13 0 0 1 0-26c2 0 4 .5 5.8 1.4A15 15 0 0 1 54 29a10 10 0 0 1-6 13z" fill="#dce8f5"/><g stroke="#62c6ff" stroke-width="3.5" stroke-linecap="round"><path d="M21 48l-3 8M34 48l-3 8M47 48l-3 8"/></g></svg>`;
  if(type=="storm") return `<svg viewBox="0 0 64 64"><path d="M48 40H18a13 13 0 0 1 0-26c2 0 4 .5 5.8 1.4A15 15 0 0 1 54 27a10 10 0 0 1-6 13z" fill="#aebdce"/><path d="M34 37l-9 15h9l-3 11 15-19H36l5-7z" fill="#ffd45a"/></svg>`;
  return `<svg viewBox="0 0 64 64"><path d="M48 46H18a13 13 0 0 1 0-26c2 0 4 .5 5.8 1.4A15 15 0 0 1 54 33a10 10 0 0 1-6 13z" fill="#dce8f5"/></svg>`;
}
let weatherSelected=0;
function renderWeather(){
 const w=DATA.weather[weatherSelected];
 $("#wx-hero").innerHTML=`<div class="wx-hero" style="margin:12px 14px"><div class="wx-hero-top"><div><div class="wx-place">${esc(w.label)}</div><div class="wx-current">${esc(w.place)}</div></div><div style="font-size:12px;opacity:.8">•••</div></div><div class="wx-hero-main"><div><div class="wx-hero-temp">${esc(w.temp)}</div><div class="wx-hero-cond">${esc(w.cond)}</div><div class="wx-hero-city">${esc(w.city)}</div></div><div class="wx-ic">${wxIcon(w.icon)}</div></div></div>`;
 $("#wx-list").innerHTML=DATA.weather.slice(1).map((item,i)=>`<div class="wx-list-row ${weatherSelected===i+1?"selected":""}" onclick="selectWeather(${i+1})"><div class="wx-ic">${wxIcon(item.icon)}</div><div class="wx-info"><div class="city">${esc(item.city)}</div><div class="cond">${esc(item.cond)}</div></div><div class="wx-temp">${esc(item.temp)}</div></div>`).join("");
}
function selectWeather(index){weatherSelected=index;renderWeather();}

let code="";
function buildPad(){
  const keys=["1","2","3","4","5","6","7","8","9","blank","0","del"];
  $("#pad").innerHTML=keys.map(k=>{
    if(k=="blank")return `<div class="key blank"></div>`;
    if(k=="del")return `<div class="key del" onclick="press('del')"><svg viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M21 5H9L3 12l6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M12 9.5l5 5M17 9.5l-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></div>`;
    const sub={"2":"ABC","3":"DEF","4":"GHI","5":"JKL","6":"MNO","7":"PQRS","8":"TUV","9":"WXYZ"}[k]||"";
    return `<div class="key" onclick="press('${k}')">${k}${sub?`<small>${sub}</small>`:""}</div>`;
  }).join("");renderDots();
}
function renderDots(){const n=DATA.passcode.length;$("#dots").innerHTML=Array.from({length:n},(_,i)=>`<div class="dot ${i<code.length?"filled":""}"></div>`).join("");}
function openPasscode(e){
  if(e && e.target.closest('.bbtn')) return;
  code="";$("#pmsg").textContent="Enter Passcode";$("#dots").classList.remove("error");renderDots();$("#passcode").classList.add("on");
}
function closePasscode(){$("#passcode").classList.remove("on");code="";renderDots();}
function press(k){
  if(k=="del"){code=code.slice(0,-1);renderDots();return;}
  if(code.length>=DATA.passcode.length)return;
  code+=k;renderDots();
  if(code.length===DATA.passcode.length)setTimeout(checkCode,160);
}
function checkCode(){
  if(code===DATA.passcode){$("#passcode").classList.remove("on");setTimeout(()=>go("home"),120);}
  else{const d=$("#dots");d.classList.add("error");$("#pmsg").textContent="Wrong Passcode. Try Again.";setTimeout(()=>{d.classList.remove("error");code="";renderDots();$("#pmsg").textContent="Enter Passcode";},650);}
}
function go(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==id));}
function goComingSoon(id){
  const titles = { 'messages': 'Messages', 'phone': 'Phone', 'spotify': 'Spotify' };
  $("#cs-title").textContent = titles[id] || 'Coming Soon';
  go("comingsoon");
}
build();
</script>
